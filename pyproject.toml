[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icici-prudential-facts-rag"
version = "0.1.0"
description = "Facts-only RAG assistant for approved ICICI Prudential AMC sources."
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.2",
  "fastapi>=0.115,<1.0",
  "pymupdf>=1.24,<2.0",
  "tokenizers>=0.20,<1.0",
  # transformers 5.x / sentence-transformers 6.x were unstable here (NaN scores, crashes).
  "sentence-transformers>=3.0,<6",
  "transformers>=4.46,<5",
  "faiss-cpu>=1.8,<2.0",
  "rank-bm25>=0.2.2,<1.0",
  "numpy>=1.26",
  "huggingface_hub>=0.25",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
